name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev,windows]"
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Windows Job Object process-tree acceptance
        if: runner.os == 'Windows'
        env:
          COMSOL_AGENT_RUN_JOB_TESTS: "1"
        run: python -m pytest tests/test_windows_job_object.py -q
